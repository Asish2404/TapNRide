<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Strip</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-300">
<div class="w-full h-16 bg-gray-300 flex items-center px-4">
    <div class="relative">
        <button id="profileBtn"
            class="flex items-center gap-2 px-2 py-1 rounded-full hover:bg-white/50 transition">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-semibold shadow">
                RK
            </div>
            <svg id="arrow"
                class="w-4 h-4 text-gray-600 transition-transform duration-200 bg-white"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
        </button>
        <div id="dropdown"
            class="hidden absolute left-0 mt-2 w-40 bg-white rounded-lg shadow-lg overflow-hidden">

            <a href="#" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
            <a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a>
            <a href="#" class="block px-4 py-2 hover:bg-gray-100">Logout</a>
        </div>
    </div>

</div>

<script>
const btn = document.getElementById("profileBtn");
const dropdown = document.getElementById("dropdown");
const arrow = document.getElementById("arrow");

btn.addEventListener("click", (e) => {
    e.stopPropagation();
    dropdown.classList.toggle("hidden");
    arrow.classList.toggle("rotate-180");
});

document.addEventListener("click", () => {
    dropdown.classList.add("hidden");
    arrow.classList.remove("rotate-180");
});
</script>

</body>
</html>
