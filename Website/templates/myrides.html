<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartBus – My Rides</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/myrides.css">
    <link rel="shortcut icon" href="/static/source/SB.jpeg" type="image/x-icon">
</head>
<body>
    <!-- Reuse your existing top-nav -->
    <header class="top-nav">
        <div class="brand">
            <a href="/home">
                <img src="/static/source/SB.jpeg" alt="SmartBus Logo" class="logo-img" />
            </a>
            <div class="info">
                <div class="brand-text">SmartBus</div>
                <div class="brand-text-sub">Tap • Travel • Secure</div>
            </div>
        </div>
        <nav class="nav-links">
            <a class="link" href="/home">Home</a>
            <a class="link" href="/dashboard">Passenger</a>
            <a class="link" href="/recharge">Recharge</a>
            <a class="link active" href="/myrides">My Rides</a> <!-- highlight here -->
            {% if user %}
            {% if user.role=="admin" %}
            <a class="link" href="/admin">Admin</a>
            {% endif %}
            <div class="profile-container">
                <button id="profileBtn" class="profile-btn">
                    <div class="avatar">{{ user.first_name[0] }}</div>
                    <span class="arrow">▼</span>
                </button>
                <div id="dropdown" class="dropdown-menu">
                    <a href="/profile">Profile</a>
                    <a href="/recharge">Recharge</a>
                    <a href="/logout">Logout</a>
                </div>
            </div>
            {% else %}
            <a class="link" href="/login">Login</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        <h1>My Rides</h1>
        <p class="subtitle">View your recent rides and penalties.</p>

        <div class="tabs">
            <button onclick="showSection('rides')">Recent Rides</button>
            <button onclick="showSection('penalties')">Penalties</button>
        </div>

        <div id="rides" class="section">
            <!-- Ride cards will be injected here -->
        </div>

        <div id="penalties" class="section" style="display:none;">
            <!-- Penalty cards will be injected here -->
        </div>
    </main>

    <footer>
        SmartBus – Tap • Travel • Secure • IoT Smart Bus Fare System
    </footer>

    <input type="hidden" id="userCardId" value="{{ user.card_id if user else '' }}">

    <script src="/static/js/myrides.js"></script>
</body>
</html>
